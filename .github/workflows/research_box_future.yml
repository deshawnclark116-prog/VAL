name: VAL prospective Box evidence paper trial
on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - research/box-future-shadow-20261120
    paths:
      - 'research_box_future.py'
      - 'tests/test_research_box_future.py'
      - '.github/workflows/research_box_future.yml'
permissions:
  contents: write
concurrency:
  group: val-box-evidence-future-only
  cancel-in-progress: false
jobs:
  paper_trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check immutability and no future-data leakage
        run: python -m unittest discover -s tests -p 'test_research_box_future.py' -v
      - name: Freeze upcoming Box challenger and settle prior paper predictions
        run: python -u research_box_future.py
      - name: Commit immutable paper ledger only from main branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/prospective_box_evidence.json reports/prospective_box_evidence.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record and grade future-only Box evidence paper predictions'
          git pull --rebase origin main
          git push origin HEAD:main
