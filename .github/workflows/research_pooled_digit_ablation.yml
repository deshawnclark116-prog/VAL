name: VAL pooled digit prediction formula ablation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_pooled_digit_ablation.py'
      - 'tests/test_research_pooled_digit_ablation.py'
      - '.github/workflows/research_pooled_digit_ablation.yml'
permissions:
  contents: write
concurrency:
  group: val-pooled-digit-ablation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate forecasts and no target leakage
        run: python -m unittest discover -s tests -v
      - name: Compare pooled architectures by session and year
        run: python -u research_pooled_digit_ablation.py
      - name: Save comprehensive comparison
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_pooled_digit_ablation.json reports/research_pooled_digit_ablation.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish pooled digit conditional prediction accuracy ablation'
          git pull --rebase origin main
          git push origin HEAD:main
