name: VAL Box v3 full Any Order head-to-head
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'val_digit_formula_v2.py'
      - 'research_digit_formula_v2.py'
      - 'tests/test_val_digit_formula_v2.py'
      - '.github/workflows/research_digit_formula_v2.yml'
permissions:
  contents: write
concurrency:
  group: val-digit-formula-research-v2
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify formula against model test suite
        run: python -m unittest discover -s tests -v
      - name: Replay official archive against v2, original, and fair random
        run: python -u research_digit_formula_v2.py
      - name: Preserve genuine numerical comparisons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_digit_box_v3.json reports/research_digit_box_v3.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Box v3 full Any Order head-to-head validation'
          git pull --rebase origin main
          git push origin HEAD:main
