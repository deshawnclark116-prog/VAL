name: VAL mock drawing machine formula stress test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_virtual_draw_lab.py'
      - 'tests/test_research_virtual_draw_lab.py'
      - '.github/workflows/research_virtual_draw_lab.yml'
permissions:
  contents: write
concurrency:
  group: val-virtual-draw-lab
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run VAL and virtual-draw correctness tests
        run: python -m unittest discover -s tests -v
      - name: Run fair and injected-bias synthetic drawings against true v2 formula
        run: python -u research_virtual_draw_lab.py
      - name: Save complete mock results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_virtual_draw_lab.json reports/research_virtual_draw_lab.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish mock drawing stress-test results'
          git pull --rebase origin main
          git push origin HEAD:main
