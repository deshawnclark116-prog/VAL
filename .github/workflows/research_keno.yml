name: VAL Keno five-spot exploratory backtest

on:
  push:
    branches: [main]
    paths:
      - 'research_keno.py'
      - 'tests/test_research_keno.py'
      - '.github/workflows/research_keno.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: val-keno-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all models
        run: python -m unittest discover -s tests -v
      - name: Research Keno five-spot results with verified parse
        run: python research_keno.py
      - name: Save research results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_keno.md reports/research_keno.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish VAL Keno exploratory five-spot results'
          git pull --rebase origin main
          git push origin HEAD:main
