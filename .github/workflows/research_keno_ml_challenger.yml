name: VAL Keno advanced ML falsification research
on:
  push:
    branches: [main]
    paths:
      - 'research_keno_ml_challenger.py'
      - 'tests/test_research_keno_ml_challenger.py'
      - '.github/workflows/research_keno_ml_challenger.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: val-keno-ml-challenger
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific modeling dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.5,<2'
      - name: Run full VAL test suite and leak checks
        run: python -m unittest discover -s tests -v
      - name: Train and test honest ML models on official Keno archive
        run: python -u research_keno_ml_challenger.py
      - name: Publish falsification results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_keno_ml_challenger.md reports/research_keno_ml_challenger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Keno ML challenger against fair null'
          git pull --rebase origin main
          git push origin HEAD:main
