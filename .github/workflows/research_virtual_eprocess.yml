name: VAL virtual mock-draw cumulative-evidence challenger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_virtual_eprocess.py'
      - 'tests/test_research_virtual_eprocess.py'
      - '.github/workflows/research_virtual_eprocess.yml'
permissions:
  contents: write
concurrency:
  group: val-virtual-eprocess
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate cumulative evidence without future leakage
        run: python -m unittest discover -s tests -v
      - name: Test prediction formula against all virtual drawing conditions
        run: python -u research_virtual_eprocess.py
      - name: Persist actual head-to-head outcomes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_virtual_eprocess.json reports/research_virtual_eprocess.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish virtual-draw cumulative evidence challenger'
          git pull --rebase origin main
          git push origin HEAD:main
