name: VAL v3 accuracy hypothesis challengers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_digit_accuracy_v3.py'
      - 'tests/test_research_digit_accuracy_v3.py'
      - '.github/workflows/research_digit_accuracy_v3.yml'
permissions:
  contents: write
concurrency:
  group: val-digit-v3-accuracy
  cancel-in-progress: false
jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test predictive models and prevent future-data leakage
        run: python -m unittest discover -s tests -v
      - name: Evaluate new prediction hypotheses against official later draws
        run: python -u research_digit_accuracy_v3.py
      - name: Persist real accuracy and calibration results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_digit_accuracy_v3.json reports/research_digit_accuracy_v3.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish v3 contextual expert accuracy challenge'
          git pull --rebase origin main
          git push origin HEAD:main
