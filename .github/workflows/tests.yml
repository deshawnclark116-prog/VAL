name: Test VAL
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.5,<2'
      - run: python -m unittest discover -s tests -v
