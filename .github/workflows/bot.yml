name: VAL next-draw bot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bot.yml'
      - 'scheduled_bot.py'
      - 'val.py'

permissions:
  contents: write

concurrency:
  group: val-daily-reports
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sync the latest main before generating current predictions
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the bot
        run: python -m unittest discover -s tests -v
      - name: Download results, score previous picks, and generate today's report
        run: python scheduled_bot.py --trials 1000
      - name: Preserve reports and the complete prediction ledger
        if: always()
        run: |
          if [ ! -f reports/latest.md ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update VAL daily picks and results'
          git pull --rebase origin main
          git push origin HEAD:main
