name: VAL one Keno ticket per draw experiment
on:
  push:
    branches: [main]
    paths:
      - 'research_keno_one_ticket.py'
      - 'tests/test_research_keno_one_ticket.py'
      - '.github/workflows/research_keno_one_ticket.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: val-keno-one-ticket
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all model tests
        run: python -m unittest discover -s tests -v
      - name: Replay one Keno five-spot ticket per official draw
        run: python research_keno_one_ticket.py
      - name: Publish comparison report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_keno_one_ticket.md reports/research_keno_one_ticket.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Keno one-ticket performance comparison'
          git pull --rebase origin main
          git push origin HEAD:main
