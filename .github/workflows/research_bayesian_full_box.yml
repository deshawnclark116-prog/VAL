name: VAL Bayesian complete Box structural challenger
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/bayesian-full-box-structural-20261120
    paths:
      - 'val_bayesian_full_box.py'
      - 'research_bayesian_full_box.py'
      - 'tests/test_val_bayesian_full_box.py'
      - '.github/workflows/research_bayesian_full_box.yml'
permissions:
  contents: write
concurrency:
  group: val-bayesian-full-box-structural
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate full Box probability and no future leakage
        run: python -m unittest discover -s tests -p 'test_val_bayesian_full_box.py' -v
      - name: Compare candidate with pooled and random on real historical and virtual full Box draws
        run: python -u research_bayesian_full_box.py --mode both
      - name: Publish full target-level data from main only
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_bayesian_full_box.md reports/research_bayesian_full_box.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record direct complete Box Bayesian structural research results'
          git pull --rebase origin main
          git push origin HEAD:main
