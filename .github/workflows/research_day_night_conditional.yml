name: VAL conditional Day-to-Night Box formula research
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/day-night-conditional-box-20261120
    paths:
      - 'val_day_night_formula.py'
      - 'research_day_night_conditional.py'
      - 'tests/test_val_day_night_formula.py'
      - '.github/workflows/research_day_night_conditional.yml'
permissions:
  contents: write
concurrency:
  group: val-day-night-conditional-box-research
  cancel-in-progress: false
jobs:
  conditional_formula:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate conditional probabilities and prospectivity
        run: python -m unittest discover -s tests -p 'test_val_day_night_formula.py' -v
      - name: Score all future Night results against independent Box controls
        run: python -u research_day_night_conditional.py --replicates 3 --train 650 --test 750
      - name: Keep auditable research output on main only
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_day_night_conditional.md reports/research_day_night_conditional.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish conditional Night formula prediction results'
          git pull --rebase origin main
          git push origin HEAD:main
