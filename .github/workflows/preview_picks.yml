name: VAL preview new generator picks

on:
  push:
    branches: [ccr-89b396fc-aaip30]
    paths:
      - 'preview_picks.py'
      - '.github/workflows/preview_picks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preview picks from real results
        run: python preview_picks.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the preview to the branch that ran
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/preview_picks.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preview new generator picks'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
