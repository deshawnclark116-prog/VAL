name: VAL Box evidence challenger validation
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/box-evidence-challenger-20261120
    paths:
      - 'val_box_challenger.py'
      - 'research_box_challenger.py'
      - 'tests/test_val_box_challenger.py'
      - '.github/workflows/research_box_challenger.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test all VAL formula invariants
        run: python -m unittest discover -s tests -v
      - name: Mock-drawing Box challenger vs fair
        run: python -u research_box_challenger.py --mode virtual
      - name: Real historical head-to-head v3 Box vs challenger vs fair
        run: python -u research_box_challenger.py --mode real
      - name: Preserve research reports only on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_box_challenger_*.json reports/research_box_challenger_*.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Box evidence challenger validation'
          git pull --rebase origin main
          git push origin HEAD:main
