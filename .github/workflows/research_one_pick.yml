name: VAL one-prediction historical research

on:
  push:
    branches: [main]
    paths:
      - 'research_one_pick.py'
      - 'tests/test_research_one_pick.py'
      - '.github/workflows/research_one_pick.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: val-one-pick
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all code
        run: python -m unittest discover -s tests -v
      - name: Run decades-long one-number historical replay
        run: python research_one_pick.py
      - name: Commit research outputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_one_pick.md reports/research_one_pick.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish VAL one-pick comparison'
          git pull --rebase origin main
          git push origin HEAD:main
