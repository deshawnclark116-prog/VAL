name: VAL Day-to-Night formula official history audit
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/day-night-conditional-box-20261120
    paths:
      - 'research_day_night_real.py'
      - '.github/workflows/research_day_night_real.yml'
permissions:
  contents: write
concurrency:
  group: val-day-night-real-audit
  cancel-in-progress: false
jobs:
  real_history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real historical Night formula accuracy and log score
        run: python -u research_day_night_real.py
      - name: Publish audit only from main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_day_night_real.json reports/research_day_night_real.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish real historical Day-to-Night formula audit'
          git pull --rebase origin main
          git push origin HEAD:main
