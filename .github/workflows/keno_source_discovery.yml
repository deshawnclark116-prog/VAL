name: Investigate Keno historical data sources
on:
  push:
    branches: [main]
    paths:
      - 'keno_source_discovery.py'
      - '.github/workflows/keno_source_discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect public results-page links and archive interfaces
        run: python keno_source_discovery.py
      - name: Save source inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/keno_source_discovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Keno public archive source discovery'
          git pull --rebase origin main
          git push origin HEAD:main
