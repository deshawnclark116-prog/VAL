name: VAL pooled digit accuracy robustness study
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_pooled_digit_followup.py'
      - 'tests/test_research_pooled_digit_followup.py'
      - '.github/workflows/research_pooled_digit_followup.yml'
permissions:
  contents: write
concurrency:
  group: val-pooled-digit-followup
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check every historical validation and prediction test
        run: python -m unittest discover -s tests -v
      - name: Recheck chosen formula by year and drawing session
        run: python -u research_pooled_digit_followup.py
      - name: Commit accuracy investigation reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_pooled_digit_followup.json reports/research_pooled_digit_followup.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Document pooled digit forecasting by year and session'
          git pull --rebase origin main
          git push origin HEAD:main
