name: VAL contextual adaptive full Box model challenge
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/contextual-regime-forecast-v1-20261120
    paths:
      - 'val_contextual_regime_box.py'
      - 'research_contextual_regime_box.py'
      - 'tests/test_val_contextual_regime_box.py'
      - '.github/workflows/research_contextual_regime_box.yml'
permissions:
  contents: write
concurrency:
  group: val-contextual-regime-v1
  cancel-in-progress: false
jobs:
  context_challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check full-Box model math, source timestamps, and no future leakage
        run: python -m unittest discover -s tests -p 'test_val_contextual_regime_box.py' -v
      - name: Score real future-from-past full Box predictions and injected-bias simulations
        run: python -u research_contextual_regime_box.py
      - name: Publish audited contextual challenger results from main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/contextual_regime_box_v1.json reports/contextual_regime_box_v1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record prospective-from-past contextual Box prediction challenger benchmark'
          git pull --rebase origin main
          git push origin HEAD:main
