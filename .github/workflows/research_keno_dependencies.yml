name: VAL Keno structural dependency audit
on:
  push:
    branches: [main]
    paths:
      - 'research_keno_dependencies.py'
      - 'tests/test_research_keno_dependencies.py'
      - '.github/workflows/research_keno_dependencies.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: val-keno-dependency-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test all VAL algorithms
        run: python -m unittest discover -s tests -v
      - name: Audit 10k official draws for statistical and predictive dependencies
        run: python research_keno_dependencies.py
      - name: Publish research analysis only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_keno_dependencies.md reports/research_keno_dependencies.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Keno structural dependency research'
          git pull --rebase origin main
          git push origin HEAD:main
