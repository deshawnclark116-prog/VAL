name: VAL frozen one-pick prospective experiment

on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '30 23 * * *'
  push:
    branches: [main]
    paths:
      - 'research_prospective.py'
      - 'tests/test_research_prospective.py'
      - '.github/workflows/research_prospective.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: val-prospective-paper
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate VAL models and retrospective assumptions
        run: python -m unittest discover -s tests -v
      - name: Save one frozen paper pick per method before target
        run: python research_prospective.py
      - name: Persist immutable predictions and official grading
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/prospective_one_pick.json reports/prospective_one_pick.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save and grade VAL prospective one-number paper predictions'
          git pull --rebase origin main
          git push origin HEAD:main
