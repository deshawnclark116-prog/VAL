name: VAL challenger methods research

on:
  push:
    branches: [main]
    paths:
      - 'research_challengers.py'
      - 'tests/test_research_challengers.py'
      - '.github/workflows/research_challengers.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: val-challengers
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all models
        run: python -m unittest discover -s tests -v
      - name: Run research-only 10000-pick challenger comparison
        run: python research_challengers.py --tickets 10000
      - name: Save challenger research output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_challengers.json reports/research_challengers.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish VAL challenger comparison research'
          git pull --rebase origin main
          git push origin HEAD:main
