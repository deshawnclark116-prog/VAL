name: VAL full-Box virtual drawing stress test
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/box-mock-draw-stress-20261120
    paths:
      - 'research_virtual_box_stress.py'
      - 'tests/test_research_virtual_box_stress.py'
      - '.github/workflows/research_virtual_box_stress.yml'
permissions:
  contents: write
concurrency:
  group: val-complete-box-virtual-stress
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate full-Box chance and future isolation
        run: python -m unittest discover -s tests -p 'test_research_virtual_box_stress.py' -v
      - name: Score every mock drawing with three matched ticket portfolios
        run: python -u research_virtual_box_stress.py --trials 8 --train 850 --test 650 --block 260
      - name: Preserve actual simulation results only on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/research_virtual_box_stress.json reports/research_virtual_box_stress.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish high-volume complete Box virtual-draw stress test'
          git pull --rebase origin main
          git push origin HEAD:main
